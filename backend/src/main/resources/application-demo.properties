# Demo profile: run the full application with zero setup.
#   mvn spring-boot:run -Dspring-boot.run.profiles=demo
# Uses an in-memory H2 database and seeds 10,000 employees on startup.
# Data is discarded when the process exits. Not for production use.
spring.datasource.url=jdbc:h2:mem:salary_demo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create

app.seed.enabled=true
app.seed.count=10000
