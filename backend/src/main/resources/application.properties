spring.application.name=salary-management

# --- Datasource (MySQL) ---
# Credentials are read from the environment so nothing secret lives in the repo.
# Set DB_URL / DB_USERNAME / DB_PASSWORD, or override the defaults below.
# No MySQL handy? Run with the `demo` profile (see application-demo.properties).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/salary_management?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update keeps the schema in sync with the entities. This is a
# deliberate v1 tradeoff (see docs/REQUIREMENTS.md): for production we would
# switch to Flyway migrations for controlled, reviewable schema changes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# --- Seeding ---
# On startup, if the employee table is empty, insert this many employees.
app.seed.enabled=true
app.seed.count=10000

# --- Server ---
server.port=8080

# --- API docs ---
springdoc.swagger-ui.path=/swagger-ui.html
